services:
  rackpeek:
    image: aptacode/rackpeek:latest
    container_name: rackpeek
    ports:
      - "9006:8080"
    volumes:
      - rackpeek-config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    labels:
            - "traefik.enable=true"
            - "traefik.http.routers.rackpeek.rule=Host(`rackpeek.localhost`)"
            - "traefik.http.routers.rackpeek.entrypoints=web"
            - "traefik.http.services.rackpeek.loadBalancer.server.port=8080"
    networks:
            - traefik_default
networks:
  traefik_default :
    name: traefik_default
    external: true

volumes:
  rackpeek-config:
