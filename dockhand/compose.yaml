services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - "/var/run/podman/podman.sock:/var/run/docker.sock" #Needed for rootfull podman
      - dockhand_data:/app/data
    labels:
            - "traefik.enable=true"
            - "traefik.http.routers.dockhand.rule=Host(`dockhand.localhost`)"
            - "traefik.http.routers.dockhand.entrypoints=web"
            - "traefik.http.services.dockhand.loadBalancer.server.port=3000"
    networks:
            - traefik_default
volumes:
  dockhand_data:

networks:
  traefik_default :
    name: traefik_default
    external: true


